---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Workflow Lint
description: Lint workflows and action definitions with actionlint and zizmor, and check formatting with oxfmt

inputs:
  actionlint-version:
    description: Version of actionlint to run
    default: latest
  zizmor-version:
    description: Version of zizmor to run
    default: latest

runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        install: false

    - name: Run actionlint
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
      run: |
        mise exec actionlint@"${ACTIONLINT_VERSION}" -- actionlint -color -shellcheck= \
          -ignore 'unexpected key "(background|cancel|parallel|wait|wait-all)" for step' \
          -ignore 'step must run script with "run" section or run action with "uses" section' \
          -ignore 'specifying action "\$/.*" in invalid format because ref is missing' \
          -ignore 'reusable workflow call "\$/.*" at "uses" is not following the format' \
          -ignore 'label "ubuntu-26\.04(-arm)?" is unknown'

    - name: Run zizmor
      if: ${{ !cancelled() }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ZIZMOR_VERSION: ${{ inputs.zizmor-version }}
      run: |
        mise exec zizmor@"${ZIZMOR_VERSION}" -- zizmor --color=always --no-progress .

    - name: Check formatting
      if: ${{ !cancelled() && hashFiles('.lefthook.toml') != '' }}
      shell: bash
      run: |
        lefthook_version="$(mise config get tools.lefthook)"
        oxfmt_version="$(mise config get tools.oxfmt)"
        tools=("lefthook@${lefthook_version}" "oxfmt@${oxfmt_version}")
        # oxfmt installs through npm, and mise refuses to install it until a
        # pinned node is present. Without a pin it uses the runner's node.
        if node_version="$(mise config get tools.node 2>/dev/null)"; then
          tools=("node@${node_version}" "${tools[@]}")
        fi
        mise exec "${tools[@]}" -- \
          lefthook run pre-commit --all-files --fail-on-changes --tag ci
