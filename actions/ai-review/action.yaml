---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: AI Review
description: Review a pull request with Robin through an OpenAI-compatible LLM endpoint

inputs:
  llm-api-key:
    description: API key for the LLM endpoint
    required: true
  llm-base-url:
    description: Base URL of the OpenAI-compatible LLM endpoint
    default: https://openrouter.ai/api/v1
  llm-model:
    description: Model the endpoint should review with
    default: openai/gpt-6-sol

runs:
  using: composite
  steps:
    - name: Run Robin
      uses: antongulin/robin@69952f90f50251a87cacd4e4d6dc316650418ffd # v2.8.0
      with:
        github-token: ${{ github.token }}
        llm-api-key: ${{ inputs.llm-api-key }}
        llm-base-url: ${{ inputs.llm-base-url }}
        model: ${{ inputs.llm-model }}
        # A REQUEST_CHANGES review from github-actions[bot] blocks auto-merge and
        # evicts merge queue entries, so findings are posted as a plain comment.
        request-changes: "false"
        # Pushes are reviewed again; the caller decides which events reach the
        # action, so it can still keep bot pull requests to one review on open.
        review-on-synchronize: "true"
