---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Renovate Regenerate Push
description: Commit the patch from renovate-regenerate to the pull request branch as the GitHub App's bot user

inputs:
  client-id:
    description: Client ID of the GitHub App that commits
    required: true
  private-key:
    description: Private key of the GitHub App that commits
    required: true

runs:
  using: composite
  steps:
    - name: Generate Token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false

    - name: Download patch
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: renovate-regenerate
        path: ${{ runner.temp }}/renovate-regenerate

    - name: Commit and push
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        user_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
        git apply --index "${RUNNER_TEMP}/renovate-regenerate/renovate-regenerate.patch"
        git commit --message "chore(renovate): regenerate generated files"
        gh auth setup-git
        git push origin "HEAD:refs/heads/${HEAD_REF}"
