---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Renovate Regenerate Push
description: Commit the patch from renovate-regenerate to the pull request branch as the GitHub App's bot user

inputs:
  client-id:
    description: Client ID of the GitHub App that commits
    required: true
  private-key:
    description: Private key of the GitHub App that commits
    required: true
  paths:
    description: Newline-separated git pathspecs the patch may change; a patch touching anything else is rejected
    required: true

runs:
  using: composite
  steps:
    - name: Generate Token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false

    - name: Download patch
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: renovate-regenerate
        path: ${{ runner.temp }}/renovate-regenerate

    # The patch was built by a job that ran dependency code, so it is checked
    # against the caller's paths here rather than trusted.
    - name: Apply patch
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        git apply "${RUNNER_TEMP}/renovate-regenerate/renovate-regenerate.patch"
        printf '%s\n' "${PATHS}" | sed '/^[[:space:]]*$/d' | git add --all --pathspec-from-file=-
        if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
          echo "::error::The patch changes files outside paths"
          git status --short
          exit 1
        fi

    - name: Commit
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        changes="${RUNNER_TEMP}/renovate-regenerate"
        git diff --cached --name-only --no-renames --diff-filter=d -z |
          while IFS= read -r -d '' path; do
            jq -nc --arg path "${path}" --rawfile contents <(base64 -w0 -- "${path}") '{$path, $contents}'
          done > "${changes}/additions.json"
        git diff --cached --name-only --no-renames --diff-filter=D -z |
          while IFS= read -r -d '' path; do
            jq -nc --arg path "${path}" '{$path}'
          done > "${changes}/deletions.json"
        jq -n \
          --arg repo "${GITHUB_REPOSITORY}" \
          --arg branch "${HEAD_REF}" \
          --arg oid "${HEAD_SHA}" \
          --slurpfile additions "${changes}/additions.json" \
          --slurpfile deletions "${changes}/deletions.json" \
          '{
            query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
            variables: {input: {
              branch: {repositoryNameWithOwner: $repo, branchName: $branch},
              expectedHeadOid: $oid,
              message: {headline: "chore(renovate): regenerate generated files"},
              fileChanges: {additions: $additions, deletions: $deletions}
            }}
          }' > "${changes}/request.json"
        gh api graphql --input "${changes}/request.json" --jq '.data.createCommitOnBranch.commit.url'
