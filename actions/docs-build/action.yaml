---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Docs Build
description: Build the docs site with mise and optionally upload it as a GitHub Pages artifact

inputs:
  deploy:
    description: Configure Pages and upload the built site as a Pages artifact
    default: "false"
  path:
    description: Directory the docs task writes the site to
    default: ./site

runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      with:
        experimental: true
        install_args: --locked

    - name: Configure Pages
      if: ${{ inputs.deploy == 'true' }}
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Build docs site
      shell: bash
      run: mise run docs

    - name: Upload artifact
      if: ${{ inputs.deploy == 'true' }}
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ inputs.path }}
