---
# Org-wide defaults applied to every repo by .github/workflows/safe-settings.yaml.
# Per-repo overrides live in .github/safe-settings/repos/<repo-name>.yml.
# Schema: https://github.com/github/safe-settings/blob/main/docs/sample-settings/settings.yml
#
# Labels-only for now: repo-level settings (default_branch, merge modes,
# features, …) are managed through org policy or by hand.

labels:
  exclude:
    # Dynamic managed
    - name: ^app/
    # Labeler managed
    - name: ^area/
    # Release Please managed
    - name: "autorelease: pending"
    - name: "autorelease: tagged"
    - name: release-please:force-run

  include:
    # Issue classification
    - name: bug
      color: d73a4a
      description: Something isn't working
    - name: documentation
      color: 0075ca
      description: Improvements or additions to documentation
    - name: enhancement
      color: a2eeef
      description: New feature or request
    - name: question
      color: d876e3
      description: Further information is requested
    - name: wontfix
      color: ffffff
      description: This will not be worked on
    - name: do-not-merge
      color: ee0701
      description: Marks PR that is not (yet) in a mergeable state
    - name: stale
      color: c5def5
      description: Marked stale by automation due to inactivity

    # Renovate control
    - name: stop-updating
      color: 5319e7
      description: Renovate will stop updating this PR

    # Semantic version types
    - name: type/digest
      color: ffec19
      description: Issue relates to a digest version bump
    - name: type/patch
      color: ffec19
      description: Issue relates to a patch version bump
    - name: type/minor
      color: ff9800
      description: Issue relates to a minor version bump
    - name: type/major
      color: f6412d
      description: Issue relates to a major version bump
