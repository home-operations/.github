---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Stale

on:
  schedule:
    - cron: 30 1 * * *
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `repositories:` input on purpose: the token is scoped to every
      # repository the app is installed on, which is what makes a single run
      # cover the org. contents:write is for --delete-branch on closed PRs.
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_CLIENT_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          owner: "${{ github.repository_owner }}"
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Process stale issues and pull requests
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          ORG: "${{ github.repository_owner }}"
          DRY_RUN: "${{ inputs.dryRun || false }}"
        run: .github/scripts/stale.sh
