name: Bug report
description: Report a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please read the [AI Usage Policy](https://github.com/home-operations/.github/blob/main/CONTRIBUTING.md#ai-usage-policy) before submitting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, what you expected, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v1.2.3"

  - type: input
    id: ai-disclosure
    attributes:
      label: AI usage disclosure
      description: If AI helped write this issue, name the model, its effort level and what it did. See the [AI Usage Policy](https://github.com/home-operations/.github/blob/main/CONTRIBUTING.md#ai-usage-policy).
      placeholder: "Claude Opus 5.5 (high effort) helped debug and drafted this issue"
